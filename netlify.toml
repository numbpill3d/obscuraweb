# Netlify configuration for THE UNDERWEB

# Since this is a static site, we don't need a build command
[build]
  publish = "."
  command = ""

# unknown paths get the themed 404 page (with a real 404 status)
[[redirects]]
  from = "/chat.html"
  to = "/"
  status = 302

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Add security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; script-src 'self' 'unsafe-inline';"

# Enable compression
[build.processing]
  skip_processing = false
[build.processing.css]
  bundle = true
  minify = true
[build.processing.js]
  bundle = true
  minify = true
[build.processing.html]
  pretty_urls = true
[build.processing.images]
  compress = true
