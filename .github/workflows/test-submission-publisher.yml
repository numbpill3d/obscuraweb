name: test submission publisher

on:
  push:
    paths:
      - '.github/scripts/publish-submission.cjs'
      - '.github/scripts/publish-submission.test.cjs'
      - 'images-data.js'
      - 'package.json'
      - '.github/workflows/test-submission-publisher.yml'
  pull_request:
    paths:
      - '.github/scripts/publish-submission.cjs'
      - '.github/scripts/publish-submission.test.cjs'
      - 'images-data.js'
      - 'package.json'
      - '.github/workflows/test-submission-publisher.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
